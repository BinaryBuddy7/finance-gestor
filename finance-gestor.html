<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Gestor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000;--card:#0c0c0c;--card2:#141414;--border:#1c1c1c;--border2:#252525;
  --orange:#f7931a;--green:#00c97a;--red:#ff4560;--purple:#9d71ff;--amber:#f5a623;--blue:#5599ff;
  --text:#e2e2e2;--text2:#6b6b6b;--text3:#3d3d3d;
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono','Fira Mono',monospace;
  --shadow:0 4px 20px rgba(0,0,0,.55);
  --shadow-lg:0 16px 48px rgba(0,0,0,.8);
  --radius:12px;--radius-sm:8px;
  --t:.15s cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text);background:var(--card2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:7px 11px;outline:none;transition:border-color var(--t),box-shadow var(--t)}
input:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(247,147,26,.08)}
select option{background:#181818}

/* LAYOUT */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:244px;min-width:244px;background:#050505;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* HEADER */
.header{display:flex;align-items:center;gap:12px;padding:10px 24px;background:rgba(5,5,5,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--orange)}
.logo svg{width:28px;height:28px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.usd-rate{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:6px 12px;font-size:13px}
.usd-rate input{width:62px;border:none;background:none;padding:0;font-family:var(--mono);color:var(--amber);text-align:center;box-shadow:none}
.btn-refresh{color:var(--text2);font-size:16px;transition:color var(--t),transform .3s}
.btn-refresh:hover{color:var(--orange);transform:rotate(180deg)}
@keyframes spin{to{transform:rotate(360deg)}}

/* SIDEBAR */
.sidebar-logo{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:#f7931a;background:linear-gradient(135deg,rgba(247,147,26,.07),transparent);letter-spacing:-.2px;cursor:pointer;transition:opacity var(--t)}
.sidebar-logo:hover{opacity:.8}
.sidebar-logo .ti{font-size:20px;filter:drop-shadow(0 0 8px rgba(247,147,26,.5))}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.sidebar-nav::-webkit-scrollbar{width:3px}
.sidebar-nav::-webkit-scrollbar-track{background:transparent}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

.nav-item{position:relative;display:flex;align-items:center;gap:9px;padding:7px 12px 7px 14px;cursor:pointer;transition:background var(--t),color var(--t);font-size:13px;color:var(--text2);user-select:none}
.nav-item:hover{background:rgba(247,147,26,.05);color:var(--orange)}
.nav-item.active{background:rgba(247,147,26,.07);color:var(--orange);font-weight:500}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--orange);border-radius:0 2px 2px 0;box-shadow:0 0 10px rgba(247,147,26,.5)}
.nav-item .ti{font-size:15px;min-width:18px}
.nav-item-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item-actions{display:none;gap:4px;align-items:center}
.nav-item:hover .nav-item-actions{display:flex}
.nav-item-actions button{padding:2px 4px;border-radius:4px;font-size:12px;color:var(--text3);transition:var(--t)}
.nav-item-actions button:hover{color:var(--text);background:var(--border2)}
.nav-folder{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);padding:10px 12px 4px 14px;margin-top:4px}
.nav-folder-header{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 14px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:var(--t);user-select:none;position:relative}
.nav-folder-header:hover{background:rgba(247,147,26,.05);color:var(--orange)}
.nav-folder-header .ti-chevron{font-size:12px;transition:transform .2s;margin-left:auto;opacity:.5}
.nav-folder-header.open .ti-chevron{transform:rotate(90deg)}
.nav-folder-header .nav-item-actions{display:none}
.nav-folder-header:hover .nav-item-actions{display:flex}
.nav-children{padding-left:10px}
.nav-children .nav-item{padding-left:20px}
.nav-children .nav-children .nav-item{padding-left:32px}
.nav-add-btn{width:100%;text-align:left;padding:5px 12px 5px 26px;color:var(--text3);font-size:12px;display:flex;align-items:center;gap:6px;border-radius:4px;transition:var(--t)}
.nav-add-btn:hover{color:var(--orange);background:rgba(247,147,26,.04)}

/* COLOR DOTS */
.color-dot{width:8px;height:8px;border-radius:50%;min-width:8px}

/* PAGE CONTENT */
.page{padding:24px 28px;flex:1}
.page-header{margin-bottom:24px}
.page-title{font-size:20px;font-weight:700;margin-bottom:4px;letter-spacing:-.3px}
.page-subtitle{color:var(--text2);font-size:13px}

/* CARDS GRID */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;transition:transform var(--t),border-color var(--t),box-shadow var(--t);position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.012),transparent);pointer-events:none}
.stat-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-card-label{font-size:11px;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat-card-value{font-size:22px;font-weight:700;font-family:var(--mono);letter-spacing:-.3px}
.stat-card-value.green{color:var(--green)}
.stat-card-value.red{color:var(--red)}
.stat-card-value.purple{color:var(--purple)}
.stat-card-value.amber{color:var(--amber)}
.stat-card-sub{font-size:11px;color:var(--text2);margin-top:6px}

/* MONTH CARDS */
.month-cards-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.month-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.month-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform var(--t),border-color var(--t),box-shadow var(--t);position:relative}
.month-card:hover{border-color:rgba(247,147,26,.3);transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,.6),0 0 0 1px rgba(247,147,26,.07)}
.month-card-cover{height:88px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.month-card-body{padding:14px}
.month-card-name{font-weight:600;font-size:14px;margin-bottom:8px;letter-spacing:-.2px}
.month-card-stats{display:flex;justify-content:space-between;align-items:center;gap:8px}
.month-card-roi{font-size:13px;font-weight:700;font-family:var(--mono)}
.month-card-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge-open{background:rgba(0,201,122,.1);color:var(--green);border:1px solid rgba(0,201,122,.15)}
.badge-closed{background:rgba(136,136,136,.08);color:var(--text2);border:1px solid rgba(136,136,136,.1)}
.month-card-profit{font-size:13px;font-family:var(--mono);color:var(--green);margin-top:6px}
.month-card-profit.neg{color:var(--red)}
.month-card-actions{position:absolute;top:8px;right:8px;display:none;gap:4px}
.month-card:hover .month-card-actions{display:flex}
.month-card-actions button{background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:4px 6px;font-size:12px;transition:var(--t);backdrop-filter:blur(4px)}
.month-card-actions button:hover{background:var(--card2);color:var(--text)}
.month-card-add{background:transparent;border:1px dashed var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:32px;color:var(--text3);transition:var(--t);cursor:pointer;border-radius:var(--radius)}
.month-card-add:hover{border-color:rgba(247,147,26,.3);color:var(--orange);background:rgba(247,147,26,.03)}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#080808;padding:10px 14px;text-align:left;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);white-space:nowrap;border-bottom:1px solid var(--border)}
thead th.num{text-align:right}
tbody tr{border-bottom:1px solid rgba(255,255,255,.03)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.02)}
tbody td{padding:10px 14px;white-space:nowrap}
tbody td.num{text-align:right;font-family:var(--mono)}
tbody td.green{color:var(--green)}
tbody td.red{color:var(--red)}
.table-actions{display:flex;gap:4px}
.table-actions button{padding:4px 7px;border-radius:5px;font-size:12px;color:var(--text3);transition:var(--t);border:1px solid transparent}
.table-actions button:hover{color:var(--text);background:var(--card2);border-color:var(--border2)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-weight:600;font-size:13px;transition:var(--t);cursor:pointer;border:none;letter-spacing:.1px}
.btn-primary{background:var(--orange);color:#000;font-weight:700}
.btn-primary:hover{background:#e07d0a;box-shadow:0 0 20px rgba(247,147,26,.35);transform:translateY(-1px)}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border2)}
.btn-secondary:hover{border-color:var(--text3);background:rgba(255,255,255,.04)}
.btn-danger{background:rgba(255,69,96,.08);color:var(--red);border:1px solid rgba(255,69,96,.15)}
.btn-danger:hover{background:rgba(255,69,96,.15);border-color:rgba(255,69,96,.3)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-purple{background:rgba(157,113,255,.1);color:var(--purple);border:1px solid rgba(157,113,255,.2)}
.btn-purple:hover{background:rgba(157,113,255,.2);box-shadow:0 0 16px rgba(157,113,255,.2)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:28px;box-shadow:var(--shadow-lg);animation:slideUp .18s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-lg{max-width:780px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:16px;font-weight:700;letter-spacing:-.2px}
.modal-close{color:var(--text3);font-size:20px;transition:var(--t);padding:4px;border-radius:6px}
.modal-close:hover{color:var(--text);background:var(--card2)}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-control{width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:13px;transition:border-color var(--t),box-shadow var(--t)}
.form-control:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px rgba(247,147,26,.08)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:10px 20px;font-size:13px;font-weight:500;color:var(--text2);border-bottom:2px solid transparent;cursor:pointer;transition:var(--t);margin-bottom:-1px}
.tab:hover{color:var(--text);background:rgba(255,255,255,.015)}
.tab.active{color:var(--orange);border-bottom-color:var(--orange);font-weight:600}

/* CHART */
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.chart-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:14px;text-transform:uppercase;letter-spacing:.7px}
.chart-canvas{max-height:220px}

/* BANNER */
.banner{border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.banner-purple{background:rgba(157,113,255,.07);border:1px solid rgba(157,113,255,.15)}
.banner-amber{background:rgba(245,166,35,.06);border:1px solid rgba(245,166,35,.15)}

/* KANBAN */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.kanban-col{min-width:220px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.kanban-col-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--border)}
.kanban-card{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;transition:var(--t)}
.kanban-card:hover{border-color:var(--border2);transform:translateX(2px)}
.kanban-card-name{font-weight:600;font-size:13px;margin-bottom:8px}
.kanban-card-vals{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);font-family:var(--mono)}

/* PROGRESS */
.progress-bar{height:3px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--amber));border-radius:2px;transition:width .5s ease}

/* TOGGLE */
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer}
.toggle input{display:none}
.toggle-track{width:34px;height:18px;background:var(--border2);border-radius:9px;position:relative;transition:var(--t)}
.toggle input:checked + .toggle-track{background:var(--orange);box-shadow:0 0 10px rgba(247,147,26,.25)}
.toggle-thumb{position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:left .2s cubic-bezier(.4,0,.2,1)}
.toggle input:checked + .toggle-track .toggle-thumb{left:18px}

/* COLOR PICKER */
.color-picker-row{display:flex;gap:8px;flex-wrap:wrap}
.color-opt{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:var(--t)}
.color-opt:hover,.color-opt.sel{border-color:#fff;transform:scale(1.2);box-shadow:0 0 8px rgba(255,255,255,.2)}

/* CHECKBOX */
.cb-cell{text-align:center}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--orange);cursor:pointer}

/* INLINE EDIT */
.inline-val{cursor:pointer;border-bottom:1px dashed transparent;transition:.15s}
.inline-val:hover{border-bottom-color:var(--text2)}

/* DESPESAS */
.fluxo-header{background:linear-gradient(135deg,rgba(85,153,255,.1),rgba(85,153,255,.03));border:1px solid rgba(85,153,255,.16);border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.fluxo-restante{font-size:20px;font-weight:700;font-family:var(--mono);letter-spacing:-.5px}

/* HOME */
.home-simulate{margin-top:24px;display:flex;align-items:center;gap:16px;padding:18px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);transition:var(--t)}
.home-simulate:hover{border-color:var(--border2)}

/* SCROLLBAR */
.main::-webkit-scrollbar,.modal::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-track,.modal::-webkit-scrollbar-track{background:transparent}
.main::-webkit-scrollbar-thumb,.modal::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.main::-webkit-scrollbar-thumb:hover,.modal::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* RESPONSIVE */
@media(max-width:700px){
  .sidebar{display:none}
  .form-row,.form-row-3{grid-template-columns:1fr}
}

/* HOME REDESIGN */
.home-section-title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);margin-bottom:14px;padding-left:1px}
.home-section-title .ti{font-size:15px}
.home-banca-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:28px}
.home-banca-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform var(--t),border-color var(--t),box-shadow var(--t);position:relative}
.home-banca-card:hover{border-color:rgba(255,255,255,.1);transform:translateY(-2px);box-shadow:var(--shadow)}
.home-banca-card-spark{height:60px;background:#050505;overflow:hidden;position:relative}
.home-banca-card-body{padding:14px}
.home-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
.home-info-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:transform var(--t),border-color var(--t),box-shadow var(--t)}
.home-info-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow)}
.home-debit-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:24px}

.home-group-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
.home-group-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform var(--t),border-color var(--t),box-shadow var(--t)}
.home-group-card:hover{border-color:rgba(255,255,255,.1);transform:translateY(-2px);box-shadow:var(--shadow)}
.home-group-card-spark{height:72px;background:#050505;position:relative;overflow:hidden}
.home-group-card-body{padding:16px}
@media(max-width:900px){.home-group-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.home-group-grid{grid-template-columns:1fr}}

@keyframes sparkDraw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes sparkFade{from{opacity:0}to{opacity:1}}
.spark-line{stroke-dasharray:1200;stroke-dashoffset:1200;animation:sparkDraw .9s cubic-bezier(.4,0,.2,1) forwards}
.spark-fill{opacity:0;animation:sparkFade .6s .4s ease forwards}

.hidden{display:none!important}
.flex{display:flex}.items-center{align-items:center}.gap-8{gap:8px}.gap-12{gap:12px}.mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mb-16{margin-bottom:16px}.ml-auto{margin-left:auto}
.text-sm{font-size:12px}.text-xs{font-size:11px}.text-muted{color:var(--text2)}.font-mono{font-family:var(--mono)}.font-bold{font-weight:700}
.divider{height:1px;background:var(--border);margin:16px 0}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.2px}
.pill-green{background:rgba(0,201,122,.1);color:var(--green);border:1px solid rgba(0,201,122,.15)}
.pill-red{background:rgba(255,69,96,.1);color:var(--red);border:1px solid rgba(255,69,96,.15)}
.pill-amber{background:rgba(245,166,35,.1);color:var(--amber);border:1px solid rgba(245,166,35,.15)}
.pill-purple{background:rgba(157,113,255,.1);color:var(--purple);border:1px solid rgba(157,113,255,.15)}

</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo" onclick="navigate('home')">
      <i class="ti ti-currency-bitcoin" style="color:#f7931a"></i>
      Finance Gestor
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <!-- HEADER -->

<script>
// ============================================================
// STATE
// ============================================================
const state = {
  usdBrl: 5.75,
  currentPage: 'home',
  currentBancaId: null,
  currentMonthId: null,

  bancas: [
    {id:'jp-crypto',name:'Banca pessoal crypto JP',type:'crypto',color:'#f7931a',parentFolder:'crypto',isOperator:false},
    {id:'op1-crypto',name:'Banca operador 1 crypto',type:'crypto',color:'#9d71ff',parentFolder:'crypto',isOperator:true,split:20},
    {id:'op2-crypto',name:'Banca operador 2 crypto',type:'crypto',color:'#ff4560',parentFolder:'crypto',isOperator:true,split:20},
    {id:'op3-crypto',name:'Banca operador 3 crypto',type:'crypto',color:'#f5a623',parentFolder:'crypto',isOperator:true,split:20},
    {id:'bet-pessoal',name:'Banca bet pessoal',type:'bet',color:'#5599ff',parentFolder:'bet',isOperator:false},
    {id:'bet-op1',name:'Banca bet operador 1',type:'bet',color:'#ff4560',parentFolder:'bet',isOperator:true,split:30},
  ],

  months: {}, // bancaId -> [{id, name, year, month, bancaInicial, status, records:[]}]

  despesas: {
    empresarial: {months:{}}, // month key -> {entries:[]}
    pessoal: {months:{}}
  },

  emprestimos: [],
  patrimonioOpts:{incluirEmp:false,incluirImp:false},
  importacao: [],

  banco: {
    contaBRL: 0,
    contaUSD: 0,
    reservaBRL: 0,
    trezorUSD: 0
  },

  folders: {
    crypto: {open:true},
    bet: {open:true},
    outras: {open:true},
    despesas: {open:true}
  },
  customExchanges: [],
  customBetHouses: [],
  despesaSettings: {
    empresarial:{cats:['Software','Software Operadores','Cartão Nubank','Cartão Will','Outros']},
    pessoal:{cats:['Alimentação','Transporte','Saúde','Lazer','Moradia','Outros']}
  }
};

// EXCHANGES list
const EXCHANGES = [
  'MEXC Spot','MEXC Futures','Gate Spot','Gate Futures','BingX Spot','BingX Futures',
  'HTX Spot','HTX Futures','Bitget Spot','Bitget Futures','KuCoin Spot','KuCoin Futures',
  'Bybit Spot','Hyper Futures','Aster','Lite','DEX Wallets'
];

// Casas de apostas regulamentadas no Brasil (SPA/MF 2024)
const BET_HOUSES = [
  'Bet365','Betano','Betfair','KTO','Sportingbet','Bwin',
  'Bodog','Betsson','Pixbet','Superbet','Novibet','Galera.bet',
  'Estrela Bet','BetNacional','F12.bet','Blaze','Sportsbet.io',
  '1xBet','VaiDeBet','Lance Bet','Brbet','Reals Bet'
];

const COLORS = ['#f7931a','#9d71ff','#00c97a','#ff4560','#5599ff','#f5a623','#e91e63','#00bcd4'];
const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// ============================================================
// PERSISTENCE
// ============================================================
const STORAGE_KEY='fg_v1';
function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({s:state,ex:EXCHANGES,bh:BET_HOUSES}));}catch(e){}
}
function exportarDados(){
  const data=JSON.stringify({s:state,ex:EXCHANGES,bh:BET_HOUSES},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();
  a.href=url;
  a.download=`finance-gestor-backup-${d.getFullYear()}${(d.getMonth()+1).toString().padStart(2,'0')}${d.getDate().toString().padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importarDados(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.s)Object.keys(d.s).forEach(k=>{state[k]=d.s[k];});
      if(Array.isArray(d.ex)){EXCHANGES.length=0;EXCHANGES.push(...d.ex);}
      if(Array.isArray(d.bh)){BET_HOUSES.length=0;BET_HOUSES.push(...d.bh);}
      saveState();
      renderSidebar();
      renderPage();
      alert('Dados importados com sucesso!');
    }catch(err){alert('Erro ao importar: arquivo inválido.');}
  };
  reader.readAsText(file);
  input.value='';
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return;
    const d=JSON.parse(raw);
    if(d.s)Object.keys(d.s).forEach(k=>{state[k]=d.s[k];});
    if(Array.isArray(d.ex)){EXCHANGES.length=0;EXCHANGES.push(...d.ex);}
    if(Array.isArray(d.bh)){BET_HOUSES.length=0;BET_HOUSES.push(...d.bh);}
  }catch(e){}
}

// ============================================================
// UTILS
// ============================================================
function fmt(v,dec=2){return Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec})}
function fmtUSD(v){return '$'+fmt(v)}
function fmtBRL(v){return 'R$'+fmt(v)}
function pct(v){return (v>=0?'+':'')+fmt(v,2)+'%'}
function uid(){return '_'+Math.random().toString(36).substr(2,9)}
function getUsd(){return parseFloat(document.getElementById('usdRate')?.value)||state.usdBrl}
function inBRL(usdVal){return usdVal*getUsd()}

async function fetchUsdRate(silent=false){
  const btn=document.querySelector('.btn-refresh');
  if(btn)btn.style.animation='spin .6s linear infinite';
  const apis=[
    ()=>fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL').then(r=>r.json()).then(d=>parseFloat(d.USDBRL.bid)),
    ()=>fetch('https://api.frankfurter.app/latest?from=USD&to=BRL').then(r=>r.json()).then(d=>d.rates.BRL),
    ()=>fetch('https://open.er-api.com/v6/latest/USD').then(r=>r.json()).then(d=>d.rates.BRL),
  ];
  let rate=null;
  for(const api of apis){
    try{rate=await api();if(rate&&rate>0)break;}catch(e){}
  }
  if(btn)btn.style.animation='';
  if(rate&&rate>0){
    const el=document.getElementById('usdRate');
    if(el)el.value=rate.toFixed(2);
    state.usdBrl=rate;
    if(!silent)showToast('Cotação atualizada: R$ '+rate.toFixed(2));
    renderPage();
  }else if(!silent){showToast('Erro ao buscar cotação','error')}
}

function showToast(msg,type='success'){
  document.querySelectorAll('.fg-toast').forEach(t=>t.remove());
  if(!document.getElementById('_toast-kf')){
    const s=document.createElement('style');s.id='_toast-kf';
    s.textContent='@keyframes _tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes _tOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(8px)}}';
    document.head.appendChild(s);
  }
  const color=type==='error'?'var(--red)':'var(--green)';
  const icon=type==='error'?'ti-alert-circle':'ti-circle-check';
  const t=document.createElement('div');
  t.className='fg-toast';
  t.style.cssText=`position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid ${color};color:var(--text);padding:12px 18px;border-radius:10px;font-weight:600;z-index:9999;font-size:13px;display:flex;align-items:center;gap:9px;box-shadow:0 4px 24px rgba(0,0,0,.6);animation:_tIn .2s cubic-bezier(.4,0,.2,1)`;
  t.innerHTML=`<i class="ti ${icon}" style="color:${color};font-size:16px"></i>${msg}`;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.animation='_tOut .2s cubic-bezier(.4,0,.2,1) forwards';setTimeout(()=>t.remove(),200)},2400);
}

// ============================================================
// SIDEBAR
// ============================================================
function renderSidebar(){
  const nav=document.getElementById('sidebarNav');
  nav.innerHTML='';

  // HOME
  nav.appendChild(navItem({icon:'ti-home-2',label:'Home',id:'home',active:state.currentPage==='home',onClick:()=>navigate('home')}));
  nav.appendChild(navItem({icon:'ti-building-bank',label:'Banco e Reserva',id:'banco',active:state.currentPage==='banco',onClick:()=>navigate('banco')}));

  nav.appendChild(navFolderHeader('Gestão de operações','ops-folder',()=>{}));

    cryptoFolder._children.appendChild(navItem({icon:'ti-wallet',label:b.name,id:b.id,color:b.color,active:state.currentPage==='banca'&&state.currentBancaId===b.id,onClick:()=>navigate('banca',b.id)}));
  });

    betFolder._children.appendChild(navItem({icon:'ti-trophy',label:b.name,id:b.id,color:b.color,active:state.currentPage==='banca'&&state.currentBancaId===b.id,onClick:()=>navigate('banca',b.id)}));
  });

  nav.appendChild(betFolder);

  // Outras folder
  const outrasFolder=navFolder('outras','📁 Outras','ti-folder');
  outrasFolder._children.appendChild(navItem({icon:'ti-hand-money',label:'Empréstimos',id:'emprestimos',active:state.currentPage==='emprestimos',onClick:()=>navigate('emprestimos')}));
  outrasFolder._children.appendChild(navItem({icon:'ti-apple',label:'Importação',id:'importacao',active:state.currentPage==='importacao',onClick:()=>navigate('importacao')}));
  nav.appendChild(outrasFolder);

  // Despesas folder
  const despFolder=navFolder('despesas','📂 Despesas','ti-report-money');

  despFolder._children.appendChild(navItem({icon:'ti-user',label:'Pessoal',id:'desp-pes',active:state.currentPage==='despesas-pessoal',onClick:()=>navigate('despesas-pessoal')}));

function navItem({icon,label,id,color,active,onClick}){
  const el=document.createElement('div');
  el.className='nav-item'+(active?' active':'');
  el.innerHTML=`
    ${color?`<span class="color-dot" style="background:${color}"></span>`:`<i class="ti ${icon}"></i>`}
    <span class="nav-item-label">${label}</span>
    <span class="nav-item-actions">
      <button title="Editar" onclick="event.stopPropagation();showEditBancaModal('${id}')"><i class="ti ti-settings"></i></button>
      <button title="Excluir" onclick="event.stopPropagation();deleteItem('${id}')"><i class="ti ti-trash"></i></button>
    </span>`;
  el.addEventListener('click',onClick);
  return el;
}

function navFolder(key,label,icon){
  const wrap=document.createElement('div');
  const isOpen=state.folders[key]?.open!==false;

  const header=document.createElement('div');
  header.className='nav-folder-header'+(isOpen?' open':'');
  header.innerHTML=`<i class="ti ${icon}" style="font-size:14px;min-width:18px"></i><span style="flex:1">${label}</span><i class="ti ti-chevron-right ti-chevron"></i>`;
  header.addEventListener('click',()=>{
    if(!state.folders[key])state.folders[key]={};
    state.folders[key].open=!state.folders[key].open;
    renderSidebar();
  });
  wrap.appendChild(header);

  const children=document.createElement('div');
  children.className='nav-children';
  if(!isOpen)children.style.display='none';
  wrap.appendChild(children);
  wrap._children=children;

  return wrap;
}

function navFolderHeader(label,key,onClick){
  const el=document.createElement('div');
  el.className='nav-folder';
  el.textContent=label;
  return el;
}

function addBancaBtn(folder){
  const btn=document.createElement('button');
  btn.className='nav-add-btn';
  btn.innerHTML=`<i class="ti ti-plus" style="font-size:11px"></i> Nova banca`;
  btn.addEventListener('click',()=>showAddBancaModal(folder));
  return btn;
}

function showEditBancaModal(id){
  const banca=state.bancas.find(b=>b.id===id);
  if(!banca)return;
  showModal({
    title:'Editar banca',
    body:`
    <div class="form-group"><label class="form-label">Nome</label><input id="m-bname" class="form-control" value="${banca.name}"></div>
    <div class="form-group"><label class="form-label">Cor</label>
      <div class="color-picker-row">${COLORS.map(c=>`<div class="color-opt${c===banca.color?' sel':''}" style="background:${c}" onclick="selectColor(this,'${c}')"></div>`).join('')}</div>
      <input type="hidden" id="m-color" value="${banca.color}">
    </div>
    <div class="form-group"><label class="form-label">É banca de operador?</label>
      <label class="toggle"><input type="checkbox" id="m-isop" ${banca.isOperator?'checked':''}><div class="toggle-track"><div class="toggle-thumb"></div></div><span>Sim</span></label>
    </div>
    <div class="form-group" id="m-split-group" style="${banca.isOperator?'':'display:none'}">
      <label class="form-label">Split do operador (%)</label>
      <input id="m-split" class="form-control" type="number" value="${banca.split||20}" min="0" max="100" step="1" placeholder="Ex: 20">
      <div class="text-xs text-muted" style="margin-top:4px">Percentual que vai para o operador sobre o lucro</div>
    </div>`,
    onOk:()=>{
      banca.name=document.getElementById('m-bname').value.trim()||banca.name;
      banca.color=document.getElementById('m-color').value;
      const isopEl=document.getElementById('m-isop');
      if(isopEl){
        banca.isOperator=isopEl.checked;
        banca.split=isopEl.checked?parseInt(document.getElementById('m-split')?.value||20):0;
      }
      closeModal();renderSidebar();renderPage();
    }
  });
  setTimeout(()=>{
    const cb=document.getElementById('m-isop');
    if(cb)cb.addEventListener('change',()=>{
      document.getElementById('m-split-group').style.display=cb.checked?'block':'none';
    });
  },50);
}

function deleteItem(id){
  if(!confirm('Excluir esta banca?'))return;
  state.bancas=state.bancas.filter(b=>b.id!==id);
  delete state.months[id];
  if(state.currentBancaId===id){state.currentBancaId=null;navigate('home')}
  else{renderSidebar();renderPage()}
}

// ============================================================
// NAVIGATION
// ============================================================
function navigate(page,bancaId,monthId){
  state.currentPage=page;
  if(bancaId)state.currentBancaId=bancaId;
  if(monthId!==undefined)state.currentMonthId=monthId;
  renderSidebar();
  renderPage();

  // breadcrumb
  const bc=document.getElementById('breadcrumb-text');
  const labels={home:'Home',banco:'Banco e Reserva',emprestimos:'Empréstimos',importacao:'Importação','despesas-empresarial':'Despesas › Empresarial','despesas-pessoal':'Despesas › Pessoal'};
  if(labels[page])bc.textContent=labels[page];
  else if(page==='banca'){
    const b=state.bancas.find(b=>b.id===bancaId);
    bc.textContent=b?b.name:'Banca';
  }else if(page==='month'){
    const b=state.bancas.find(b=>b.id===state.currentBancaId);
    const months=state.months[state.currentBancaId]||[];
    const m=months.find(m=>m.id===state.currentMonthId);
    bc.textContent=`${b?.name||''} › ${m?.name||''}`;
  }
}

function renderPage(){
  const el=document.getElementById('mainContent');
  const p=state.currentPage;
  if(p==='home')el.innerHTML=renderHome();
  else if(p==='banca')el.innerHTML=renderBanca();
  else if(p==='month')el.innerHTML=renderMonth();
  else if(p==='banco')el.innerHTML=renderBanco();
  else if(p==='emprestimos')el.innerHTML=renderEmprestimos();
  else if(p==='importacao')el.innerHTML=renderImportacao();
  else if(p==='despesas-empresarial')el.innerHTML=renderDespesas('empresarial');
  else if(p==='despesas-pessoal')el.innerHTML=renderDespesas('pessoal');
  afterRender();
  saveState();
}

// ============================================================
// HOME HELPERS
// ============================================================
function calcBancaLucro(bancaId){
  return (state.months[bancaId]||[]).reduce((s,m)=>{
    const recs=m.records||[];
    if(!recs.length)return s;
    return s+(recs[recs.length-1].bancaFinalDia||0)-(m.bancaInicial||0);
  },0);
}
function calcBancaROI(bancaId){
  const months=state.months[bancaId]||[];
  const init=months.reduce((s,m)=>s+(m.bancaInicial||0),0);
  const lucro=calcBancaLucro(bancaId);
  return init?(lucro/init)*100:0;
}
function mkSparklinePath(data,w,h){
  if(data.length<2)return null;
  const min=Math.min(...data);const max=Math.max(...data);const range=max-min||max||1;
  return data.map((v,i)=>`${(i/(data.length-1))*(w-16)+8},${h-8-((v-min)/range)*(h-16)}`).join(' ');
}
function renderHomeGroupCard(opts){
  const {icon,iconColor,title,lucro,roi,bancas,sparkData,accentColor,onClick,rows,type}=opts;
  const pts=mkSparklinePath(sparkData,400,72);
  const sparkSvg=pts
    ?`<svg width="100%" height="72" viewBox="0 0 400 72" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0"><defs><linearGradient id="hgg${title.replace(/\s/g,'')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${accentColor}" stop-opacity=".22"/><stop offset="100%" stop-color="${accentColor}" stop-opacity="0"/></linearGradient></defs><polygon class="spark-fill" points="${pts} 392,72 8,72" fill="url(#hgg${title.replace(/\s/g,'')})"/><polyline class="spark-line" points="${pts}" fill="none" stroke="${accentColor}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
    :`<svg width="100%" height="72" viewBox="0 0 400 72" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0"><line x1="8" y1="36" x2="392" y2="36" stroke="${accentColor}" stroke-width="1" stroke-dasharray="4 4" opacity=".18"/></svg>`;
  return`<div class="home-group-card" onclick="${onClick}">
    <div class="home-group-card-spark">${sparkSvg}</div>
    <div class="home-group-card-body">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <i class="ti ${icon}" style="font-size:18px;color:${iconColor}"></i>
        <span style="font-weight:700;font-size:15px;flex:1">${title}</span>
        <span class="text-xs text-muted">${bancas} banca${bancas!==1?'s':''}</span>
      </div>
      <div class="font-mono" style="font-size:26px;font-weight:700;color:${lucro>=0?'var(--green)':'var(--red)'};letter-spacing:-.5px">${type==='crypto'?fmtUSD(lucro):fmtBRL(lucro*getUsd())}</div>
      ${type==='crypto'?`<div style="font-size:11px;color:var(--text3);margin-top:2px;font-family:var(--mono)">${fmtBRL(lucro*getUsd())}</div>`:''}

      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
        <span class="text-xs font-mono" style="color:${roi>=0?'var(--green)':'var(--red)'}">ROI ${pct(roi)}</span>
        <i class="ti ti-chevron-right" style="color:var(--text3);font-size:14px"></i>
      </div>
      ${rows?`<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:10px;display:flex;flex-direction:column;gap:6px">${rows}</div>`:''}
    </div>
  </div>`;
}

// HOME
// ============================================================
function renderHome(){
  // Crypto aggregate
  const cryptoBancas=state.bancas.filter(b=>b.parentFolder==='crypto');
  const cryptoLucro=cryptoBancas.reduce((s,b)=>s+calcBancaLucro(b.id),0);
  const cryptoInit=cryptoBancas.reduce((s,b)=>{
    return s+(state.months[b.id]||[]).reduce((ss,m)=>ss+(m.bancaInicial||0),0);
  },0);
  const cryptoROI=cryptoInit?(cryptoLucro/cryptoInit)*100:0;
  const cryptoRecs=cryptoBancas.flatMap(b=>(state.months[b.id]||[]).slice().sort((a,c)=>a.year*100+a.month-(c.year*100+c.month)).flatMap(m=>m.records||[]));
  const cryptoRows=cryptoBancas.map(b=>{
    const l=calcBancaLucro(b.id);
    return`<div style="display:flex;align-items:center;gap:6px;font-size:12px">
      <span class="color-dot" style="background:${b.color}"></span>
      <span style="flex:1;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b.name}${b.isOperator?` <span style="color:var(--purple);font-size:10px">OP ${b.split||0}%</span>`:''}</span>
      <span class="font-mono" style="color:${l>=0?'var(--green)':'var(--red)'}">${fmtUSD(l)}</span>
    </div>`;
  }).join('');

  // Bet aggregate
  const betBancas=state.bancas.filter(b=>b.parentFolder==='bet');
  const betLucro=betBancas.reduce((s,b)=>s+calcBancaLucro(b.id),0);
  const betInit=betBancas.reduce((s,b)=>{
    return s+(state.months[b.id]||[]).reduce((ss,m)=>ss+(m.bancaInicial||0),0);
  },0);
  const betROI=betInit?(betLucro/betInit)*100:0;
  const betRecs=betBancas.flatMap(b=>(state.months[b.id]||[]).slice().sort((a,c)=>a.year*100+a.month-(c.year*100+c.month)).flatMap(m=>m.records||[]));
  const betRows=betBancas.map(b=>{
    const l=calcBancaLucro(b.id);
    return`<div style="display:flex;align-items:center;gap:6px;font-size:12px">
      <span class="color-dot" style="background:${b.color}"></span>
      <span style="flex:1;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b.name}${b.isOperator?` <span style="color:var(--purple);font-size:10px">OP ${b.split||0}%</span>`:''}</span>
      <span class="font-mono" style="color:${l>=0?'var(--green)':'var(--red)'}">${fmtBRL(l*getUsd())}</span>
    </div>`;
  }).join('');

  // Saldo atual das bancas (último bancaFinalDia de cada banca)
  function bancaSaldoAtual(bancaId){
    const months=(state.months[bancaId]||[]).slice().sort((a,c)=>a.year*100+a.month-(c.year*100+c.month));
    if(!months.length)return 0;
    const lastMonth=months[months.length-1];
    const recs=lastMonth.records||[];
    if(!recs.length)return lastMonth.bancaInicial||0;
    return recs[recs.length-1].bancaFinalDia||0;
  }
  const cryptoSaldoUSD=cryptoBancas.reduce((s,b)=>s+bancaSaldoAtual(b.id),0);
  const betSaldoBRL=betBancas.reduce((s,b)=>s+bancaSaldoAtual(b.id),0);

  // Totals
  const totalLucro=cryptoLucro+betLucro;

  // Empréstimos + Outros
  const empCap=state.emprestimos.reduce((s,e)=>s+(e.capital||0),0);
  const empRec=state.emprestimos.reduce((s,e)=>s+(e.parcelas||[]).filter(p=>p.pago).reduce((ss,p)=>ss+(p.valor||0),0),0);
  const empJurosRec=state.emprestimos.reduce((s,e)=>{
    const n=(e.parcelas||[]).length;
    const totalP=(e.parcelas||[]).reduce((ss,p)=>ss+(p.valor||0),0);
    const jurosP=n?Math.max(0,totalP-(e.capital||0))/n:0;
    return s+(e.parcelas||[]).filter(p=>p.pago).length*jurosP;
  },0);
  const impReal=state.importacao.filter(p=>p.status==='Vendido').reduce((s,p)=>s+(p.lucro||0),0);
  const impProj=state.importacao.filter(p=>p.status!=='Vendido').reduce((s,p)=>s+((p.vendaProjetada||0)-(p.custo||0))*getUsd(),0);

  const dPesTot=dPes.filter(e=>e.tipo==='Saída').reduce((s,e)=>s+(parseFloat(e.valorEsperado)||0),0);
  const dEmpPago=dEmp.filter(e=>e.tipo==='Saída'&&e.pago).reduce((s,e)=>s+(parseFloat(e.valorReal||e.valorEsperado)||0),0);
  const dPesPago=dPes.filter(e=>e.tipo==='Saída'&&e.pago).reduce((s,e)=>s+(parseFloat(e.valorReal||e.valorEsperado)||0),0);

  return`

  <div class="page-subtitle">Visão geral do seu patrimônio e operações</div>
</div>

<div class="cards-grid" style="grid-template-columns:repeat(2,1fr);max-width:400px;margin-bottom:12px">

    <div class="stat-card-label"><i class="ti ti-building-bank"></i> Total patrimônio</div>
    <div class="stat-card-value green" id="home-patrimonio-val">${(()=>{
      const base=(state.banco.contaBRL+state.banco.reservaBRL+betSaldoBRL)+(state.banco.contaUSD+state.banco.trezorUSD+cryptoSaldoUSD)*getUsd();
      const withEmp=state.patrimonioOpts.incluirEmp?empCap:0;
      const withImp=state.patrimonioOpts.incluirImp?impReal+impProj:0;
      return fmtBRL(base+withEmp+withImp);

  </div>

<div class="home-group-grid">

function renderMonthCard(banca,m){
  const recs=m.records||[];
  const lucro=recs.length?(recs[recs.length-1].bancaFinalDia||0)-(m.bancaInicial||0):0;
  const roi=m.bancaInicial?((lucro/m.bancaInicial)*100):0;
  const color=banca.color||'#f7931a';
  // Data includes bancaInicial as first point so chart always renders
  const dataPoints=[m.bancaInicial||0,...recs.map(r=>r.bancaFinalDia||0)];
  const pts=mkSparklinePath(dataPoints,200,88);
  let sparkLine='';
  if(pts){
    sparkLine=`<defs><linearGradient id="g${m.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".28"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon class="spark-fill" points="${pts} 192,88 8,88" fill="url(#g${m.id})"/><polyline class="spark-line" points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  }else{
    sparkLine=`<line x1="8" y1="44" x2="192" y2="44" stroke="${color}" stroke-width="1" opacity=".2" stroke-dasharray="4 4"/>`;
  }
  const svgCover=`<svg width="100%" height="100%" viewBox="0 0 200 88" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0" preserveAspectRatio="none">
    <rect width="200" height="88" fill="#050505"/>
    <text x="100" y="52" text-anchor="middle" fill="${color}" font-size="30" font-weight="bold" font-family="system-ui,sans-serif" opacity=".08">${m.name.substring(0,3).toUpperCase()}</text>
    ${sparkLine}
  </svg>`;

  return `
<div class="month-card" onclick="navigate('month','${banca.id}','${m.id}')">
  <div class="month-card-cover" style="background:#0a0a0a">${svgCover}</div>
  <div class="month-card-body">
    <div class="month-card-name">${m.name}</div>
    <div class="month-card-stats">
      <span class="month-card-roi ${roi>=0?'green':'red'}" style="color:${roi>=0?'var(--green)':'var(--red)'}">${pct(roi)}</span>
      <span class="month-card-badge ${m.status==='open'?'badge-open':'badge-closed'}">${m.status==='open'?'Aberto':'Fechado'}</span>
    </div>
    <div class="month-card-profit ${lucro<0?'neg':''}" style="margin-top:4px">${banca.type==='crypto'?fmtUSD(lucro):fmtBRL(lucro*getUsd())}</div>
    ${banca.type==='crypto'?`<div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:1px">${fmtBRL(lucro*getUsd())}</div>`:''}
  </div>
  <div class="month-card-actions">
    <button onclick="event.stopPropagation();editMonth('${banca.id}','${m.id}')"><i class="ti ti-pencil"></i></button>
    <button onclick="event.stopPropagation();deleteMonth('${banca.id}','${m.id}')"><i class="ti ti-trash"></i></button>
  </div>
</div>`;
}

function renderMonth(){
  const banca=state.bancas.find(b=>b.id===state.currentBancaId);
  const months=state.months[state.currentBancaId]||[];
  const m=months.find(m=>m.id===state.currentMonthId);
  if(!banca||!m)return '<div class="page">Mês não encontrado</div>';

  const recs=m.records||[];
  const bancaFinal=recs.length?(recs[recs.length-1].bancaFinalDia||0):m.bancaInicial||0;
  const lucro=bancaFinal-(m.bancaInicial||0);
  const roi=m.bancaInicial?((lucro/m.bancaInicial)*100):0;
  const lucroMedio=recs.length?(lucro/recs.length):0;
  const activeEx=m.activeExchanges||[];

  const isBet=banca.type==='bet';

  let operadorBanner='';
  if(banca.isOperator){
    const opPct=m.operatorPct!=null?m.operatorPct:(banca.split||20);
    const roiUSD=lucro;

function afterRender(){
  // Draw chart if on month page
  if(state.currentPage==='month'){
    const months=state.months[state.currentBancaId]||[];
    const m=months.find(m=>m.id===state.currentMonthId);
    if(!m)return;
    const recs=m.records||[];
    const canvas=document.getElementById('monthChart');
    if(!canvas)return;
    const labels=recs.map(r=>r.data.split('-')[2]+'/'+r.data.split('-')[1]);
    const data=recs.map(r=>(r.bancaFinalDia||0)-(m.bancaInicial||0));
    if(window._monthChart)window._monthChart.destroy();
    window._monthChart=new Chart(canvas,{
      type:'line',
      data:{
        labels,
        datasets:[{
          label:'Lucro Acumulado ($)',
          data,
          borderColor:'#00c97a',
          backgroundColor:'rgba(0,201,122,.08)',
          fill:true,
          tension:.4,
          pointBackgroundColor:'#00c97a',
          pointRadius:4,
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:true,
        plugins:{legend:{display:false}},
        scales:{
          x:{grid:{color:'#1a1a1a'},ticks:{color:'#666'}},
          y:{grid:{color:'#1a1a1a'},ticks:{color:'#666',callback:v=>'$'+v}}
        }
      }
    });
  }
  if(state.currentPage==='despesas-empresarial'||state.currentPage==='despesas-pessoal'){
    drawDespesasChart();
  }
}

function renderEmprestimos(){
  const emps=[...state.emprestimos].sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
  const totalCap=emps.reduce((s,e)=>s+(e.capital||0),0);
  const totalAReceber=emps.reduce((s,e)=>s+(e.parcelas||[]).reduce((ss,p)=>ss+(p.valor||0),0),0);
  const jurosTotal=totalAReceber-totalCap;
  const totalRec=emps.reduce((s,e)=>s+(e.parcelas||[]).filter(p=>p.pago).reduce((ss,p)=>ss+(p.valor||0),0),0);
  const pendente=totalAReceber-totalRec;
  // rendaMensal real: média mensal de juros calculada pelas parcelas reais (não pelo campo jurosPct)
  const rendaMensal=emps.reduce((s,e)=>{
    const n=(e.parcelas||[]).length;
    const totalP=(e.parcelas||[]).reduce((ss,p)=>ss+(p.valor||0),0);
    return s+(n?(totalP-(e.capital||0))/n:0);
  },0);
  const mediaJuros=totalCap?rendaMensal/totalCap*100:0;

  return `
<div class="page-header" style="display:flex;align-items:center;justify-content:space-between">
  <div><div class="page-title">Empréstimos</div><div class="page-subtitle">Controle de devedores e parcelas</div></div>
  <button class="btn btn-primary btn-sm" onclick="showAddEmprestimoModal()"><i class="ti ti-plus"></i> Novo devedor</button>
</div>
<div class="cards-grid" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">
  <div class="stat-card"><div class="stat-card-label"><i class="ti ti-cash"></i> Capital emprestado</div><div class="stat-card-value amber">${fmtBRL(totalCap)}</div></div>
  <div class="stat-card"><div class="stat-card-label"><i class="ti ti-percent"></i> Média de juros</div><div class="stat-card-value purple">${fmt(mediaJuros,2)}%/mês</div><div class="stat-card-sub">${fmtBRL(rendaMensal)}/mês sobre capital</div></div>
  <div class="stat-card"><div class="stat-card-label"><i class="ti ti-trending-up"></i> Lucro total (juros)</div><div class="stat-card-value green">${fmtBRL(jurosTotal)}</div></div>
  <div class="stat-card"><div class="stat-card-label"><i class="ti ti-receipt-2"></i> Total recebido</div><div class="stat-card-value green">${fmtBRL(totalRec)}</div></div>
  <div class="stat-card"><div class="stat-card-label"><i class="ti ti-clock-hour-4"></i> Pendente</div><div class="stat-card-value ${pendente>0?'amber':'green'}">${fmtBRL(pendente)}</div></div>
</div>
${emps.map(e=>{
  const pagas=e.parcelas?.filter(p=>p.pago).length||0;
  const total=e.parcelas?.length||0;
  const pct=total?Math.round(pagas/total*100):0;
  const diaVenc=e.vencimento?parseInt(e.vencimento.split('-')[2]):null;
  const totalEmp=(e.parcelas||[]).reduce((s,p)=>s+(p.valor||0),0);
  const recEmp=(e.parcelas||[]).filter(p=>p.pago).reduce((s,p)=>s+(p.valor||0),0);
  return `<div class="stat-card" style="margin-bottom:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div style="font-weight:700">${e.nome}</div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-secondary btn-sm" onclick="editEmprestimo('${e.id}')"><i class="ti ti-pencil"></i></button>
        <button class="btn btn-danger btn-sm" onclick="deleteEmprestimo('${e.id}')"><i class="ti ti-trash"></i></button>
      </div>
    </div>
    ${e.descricao?`<div class="text-sm text-muted" style="margin-bottom:8px">${e.descricao}</div>`:''}
    <div style="display:flex;gap:24px;margin-bottom:12px;font-size:13px;flex-wrap:wrap">
      <span><b style="color:var(--amber)">${fmtBRL(e.capital||0)}</b> capital</span>
      <span><b>${e.jurosPct||0}%</b>/mês</span>
      <span><b style="color:var(--green)">${fmtBRL(totalEmp-e.capital)}</b> juros</span>
      <span><b>${fmtBRL(recEmp)}</b> recebido</span>
    </div>
    <div class="text-sm text-muted" style="margin-bottom:6px">${pagas}/${total} parcelas pagas</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px">
      ${(e.parcelas||[]).map((p,i)=>`
        <button onclick="toggleParcela('${e.id}',${p.id})" style="cursor:pointer;border:none;background:none;padding:0">
          <div class="pill ${p.pago?'pill-green':'pill-amber'}" style="flex-direction:column;gap:1px;padding:4px 10px;line-height:1.2">
            <span>${e.vencimento?getParcelaMes(i,e.vencimento):p.mes}</span>
            ${diaVenc?`<span style="font-size:9px;opacity:.65">dia ${diaVenc}</span>`:''}
          </div>
        </button>
      `).join('')}
    </div>
  </div>`;
}).join('')}
${!emps.length?'<div style="text-align:center;color:var(--text3);padding:40px">Nenhum devedor cadastrado.</div>':''}`;
}

function toggleParcela(empId,parcelaId){
  const emp=state.emprestimos.find(e=>e.id===empId);
  if(!emp)return;
  const p=emp.parcelas?.find(p=>p.id===parcelaId);
  if(p)p.pago=!p.pago;
  renderPage();
}

function moveImp(id,newStatus){
  const p=state.importacao.find(p=>p.id===id);
  if(!p)return;
  p.status=newStatus;
  if(newStatus==='Vendido')p.lucro=((p.vendaProjetada||0)-(p.custo||0))*getUsd();
  renderPage();
}

function deleteImp(id){
  if(!confirm('Excluir produto?'))return;
  state.importacao=state.importacao.filter(p=>p.id!==id);
  renderPage();
}

function renderDespRelatorio(tipo,entries,cats){
  const saidas=entries.filter(e=>e.tipo==='Saída'&&e.pago);
  const totalGasto=saidas.reduce((s,e)=>s+(parseFloat(e.valorReal||e.valorEsperado)||0),0);
  const totalEsp=entries.filter(e=>e.tipo==='Saída').reduce((s,e)=>s+(parseFloat(e.valorEsperado)||0),0);
  const pendentes=entries.filter(e=>e.tipo==='Saída'&&!e.pago);
  const totalPend=pendentes.reduce((s,e)=>s+(parseFloat(e.valorEsperado)||0),0);
  const restante=totalEsp-totalGasto;

  const byCat=cats.map(c=>{
    const total=saidas.filter(e=>e.categoria===c).reduce((s,e)=>s+(parseFloat(e.valorReal||e.valorEsperado)||0),0);
    return {c,total};
  }).filter(x=>x.total>0);

  return `
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
  <div>
    <div style="font-weight:700;margin-bottom:12px">Resumo por categoria</div>
    ${byCat.map(x=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
        <span>${x.c}</span>
        <span class="font-mono red">${fmtBRL(x.total)}</span>
      </div>`).join('')}
    <div class="divider"></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:8px">
      <span style="font-weight:600">Total gasto</span><span class="font-mono red">${fmtBRL(totalGasto)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;margin-bottom:8px">
      <span style="font-weight:600">Saídas pendentes</span><span class="font-mono amber">${fmtBRL(totalPend)}</span>
    </div>
    <div style="display:flex;justify-content:space-between">
      <span style="font-weight:700">Dinheiro restante</span><span class="font-mono green font-bold">${fmtBRL(restante)}</span>
    </div>
  </div>
  <div>
    <div class="chart-wrap" style="margin-bottom:0">
      <div class="chart-title">Distribuição por categoria</div>
      <canvas id="despChart" class="chart-canvas" style="max-height:200px"></canvas>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
      <div class="stat-card"><div class="stat-card-label">Total gasto</div><div class="stat-card-value red" style="font-size:16px">${fmtBRL(totalGasto)}</div></div>
      <div class="stat-card"><div class="stat-card-label">Restante</div><div class="stat-card-value green" style="font-size:16px">${fmtBRL(restante)}</div></div>
    </div>
  </div>
</div>`;
}

function drawDespesasChart(){
  const tipo=state.currentPage==='despesas-empresarial'?'empresarial':'pessoal';
  const cats=state.despesaSettings[tipo]?.cats||[];
  const curMonth=getCurrentDespMonth(tipo);
  const entries=state.despesas[tipo].months[curMonth]?.entries||[];
  const canvas=document.getElementById('despChart');
  if(!canvas)return;
  const saidas=entries.filter(e=>e.tipo==='Saída'&&e.pago);
  const data=cats.map(c=>saidas.filter(e=>e.categoria===c).reduce((s,e)=>s+(parseFloat(e.valorReal||e.valorEsperado)||0),0));
  const colors=['#5599ff','#9d71ff','#ff4560','#f5a623','#00c97a','#888'];
  if(window._despChart)window._despChart.destroy();
  window._despChart=new Chart(canvas,{
    type:'doughnut',
    data:{labels:cats,datasets:[{data,backgroundColor:colors,borderWidth:0}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#888',font:{size:11}}}}}
  });
}

function getCurrentDespMonth(tipo){
  return window[`despMonth_${tipo}`]||'2026-05';
}

function getMonthOptions(selected){
  const months=['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10','2026-11','2026-12'];
  return months.map(m=>{
    const [y,mo]=m.split('-');
    return `<option value="${m}" ${m===selected?'selected':''}>${MONTHS_PT[parseInt(mo)-1]} ${y}</option>`;
  }).join('');
}

function changeDespMonth(tipo,val){
  window[`despMonth_${tipo}`]=val;
  renderPage();
}

function switchDespTab(tipo,tab){
  window[`${tipo}ActiveTab`]=tab;
  renderPage();
}

function toggleDespPago(tipo,month,id,checked){
  const entry=state.despesas[tipo].months[month]?.entries?.find(e=>e.id===id);
  if(!entry)return;
  entry.pago=checked;
  if(checked&&!entry.valorReal)entry.valorReal=entry.valorEsperado;
  if(checked&&!entry.dataFinal)entry.dataFinal=new Date().toISOString().split('T')[0];
  renderPage();
}

  state.despesaSettings[tipo]?.cats.splice(idx,1);

function showAddRecordModal(bancaId,monthId){
  const months=state.months[bancaId]||[];
  const m=months.find(m=>m.id===monthId);
  if(!m)return;
  const banca=state.bancas.find(b=>b.id===bancaId);
  const activeEx=m.activeExchanges||[];
  const today=new Date().toISOString().split('T')[0];

  showModal({
    title:'Novo registro',
    large:true,
    body:`
    <div class="form-row">
        <div class="form-group"><label class="form-label">Data</label><input id="m-data" class="form-control" type="date" value="${today}"></div>
        <div class="form-group"><label class="form-label">Tipo</label>
          <select id="m-tipo" class="form-control"><option>Operação</option><option>Depósito</option><option>Saque</option></select></div>
      </div>
      <div class="form-group"><label class="form-label">Banca Inicial do Dia ($)</label><input id="m-bval" class="form-control" type="number" step="0.01"></div>

      <div class="form-row-3">
        ${activeEx.map(ex=>`<div class="form-group"><label class="form-label" style="font-size:11px">${ex}</label><input id="ex-${ex.replace(/\s/g,'_')}" class="form-control" type="number" step="0.01" placeholder="0" oninput="calcRecord()"></div>`).join('')}
      </div>
      <div style="background:var(--card2);border-radius:8px;padding:12px;display:flex;gap:20px;font-size:13px" id="record-calc">
        <span>Banca Final: <b id="rc-final" class="font-mono">$0.00</b></span>
        <span>% Dia: <b id="rc-pct" class="font-mono green">0.00%</b></span>
        <span>Lucro $: <b id="rc-lucro" class="font-mono green">$0.00</b></span>
        <span>Lucro R$: <b id="rc-brl" class="font-mono">R$0.00</b></span>
      </div>`,
    onOk:()=>{
      const bancaInicial=parseFloat(document.getElementById('m-bval').value)||0;
      const exchanges={};
      let bancaFinal=0;
      activeEx.forEach(ex=>{
        const v=parseFloat(document.getElementById('ex-'+ex.replace(/\s/g,'_'))?.value)||0;
        if(v>0){exchanges[ex]=v;bancaFinal+=v;}
      });
      if(!bancaFinal)bancaFinal=bancaInicial;
      const lucroUSD=bancaFinal-bancaInicial;
      const pctDia=bancaInicial?(lucroUSD/bancaInicial*100):0;
      m.records.push({
        id:uid(),
        data:document.getElementById('m-data').value,
        tipo:document.getElementById('m-tipo').value,
        bancaValor:bancaInicial,
        exchanges,
        bancaFinalDia:bancaFinal,
        pctDia,lucroUSD,
        'lucroR$':lucroUSD*getUsd()
      });
      closeModal();renderPage();
    }
  });

function calcRecord(){
  const bv=parseFloat(document.getElementById('m-bval')?.value)||0;
  let total=0;
  document.querySelectorAll('[id^="ex-"]').forEach(inp=>{total+=parseFloat(inp.value)||0});
  if(!total)total=bv;
  const lucro=total-bv;
  const pct=bv?(lucro/bv*100):0;
  const rcF=document.getElementById('rc-final');
  const rcP=document.getElementById('rc-pct');
  const rcL=document.getElementById('rc-lucro');
  const rcB=document.getElementById('rc-brl');
  if(rcF)rcF.textContent=fmtUSD(total);
  if(rcP){rcP.textContent=pct.toFixed(2)+'%';rcP.style.color=pct>=0?'var(--green)':'var(--red)'}
  if(rcL){rcL.textContent=fmtUSD(lucro);rcL.style.color=lucro>=0?'var(--green)':'var(--red)'}
  if(rcB)rcB.textContent=fmtBRL(lucro*getUsd());
}


function editRecord(bancaId,monthId,recordId){
  const months=state.months[bancaId]||[];
  const m=months.find(m=>m.id===monthId);
  const r=m?.records?.find(r=>r.id===recordId);
  if(!r)return;
  const activeEx=m.activeExchanges||[];
  showModal({
    title:'Editar registro',
    large:true,
    body:`
    <div class="form-row">
      <div class="form-group"><label class="form-label">Data</label><input id="m-data" class="form-control" type="date" value="${r.data}"></div>
      <div class="form-group"><label class="form-label">Tipo</label>
        <select id="m-tipo" class="form-control"><option ${r.tipo==='Operação'?'selected':''}>Operação</option><option ${r.tipo==='Depósito'?'selected':''}>Depósito</option><option ${r.tipo==='Saque'?'selected':''}>Saque</option></select></div>
    </div>
    <div class="form-group"><label class="form-label">Banca Inicial ($)</label><input id="m-bval" class="form-control" type="number" step="0.01" value="${r.bancaValor||0}"></div>
    <div class="form-row-3">
      ${activeEx.map(ex=>`<div class="form-group"><label class="form-label" style="font-size:11px">${ex}</label><input id="ex-${ex.replace(/\s/g,'_')}" class="form-control" type="number" step="0.01" value="${r.exchanges?.[ex]||0}" oninput="calcRecord()"></div>`).join('')}
    </div>`,
    onOk:()=>{
      r.data=document.getElementById('m-data').value;
      r.tipo=document.getElementById('m-tipo').value;
      r.bancaValor=parseFloat(document.getElementById('m-bval').value)||0;
      let bf=0;
      activeEx.forEach(ex=>{
        const v=parseFloat(document.getElementById('ex-'+ex.replace(/\s/g,'_'))?.value)||0;
        r.exchanges[ex]=v;bf+=v;
      });
      if(!bf)bf=r.bancaValor;
      r.bancaFinalDia=bf;
      r.lucroUSD=bf-r.bancaValor;
      r.pctDia=r.bancaValor?(r.lucroUSD/r.bancaValor*100):0;
      r['lucroR$']=r.lucroUSD*getUsd();
      closeModal();renderPage();
    }
  });
}

function setMonthOpPct(bancaId,monthId,val){
  const m=state.months[bancaId]?.find(m=>m.id===monthId);
  if(!m)return;
  m.operatorPct=parseFloat(val)||0;
  renderPage();
}

function deleteRecord(bancaId,monthId,recordId){
  if(!confirm('Excluir registro?'))return;
  const m=state.months[bancaId]?.find(m=>m.id===monthId);
  if(m)m.records=m.records.filter(r=>r.id!==recordId);
  renderPage();
}

function showManageColumns(bancaId,monthId){
  const m=state.months[bancaId]?.find(m=>m.id===monthId);
  const banca=state.bancas.find(b=>b.id===bancaId);
  if(!m)return;
  const active=m.activeExchanges||[];
  const isBet=banca?.type==='bet';
  const list=isBet?BET_HOUSES:EXCHANGES;
  const customList=isBet?state.customBetHouses:state.customExchanges;
  const lbl=isBet?'casa de apostas':'exchange';
  window._manageColCtx={bancaId,monthId,isBet};
  showModal({
    title:isBet?'Casas de apostas regulamentadas':'Gerenciar exchanges',
    body:`
    <div style="font-size:12px;color:var(--text2);margin-bottom:4px">Selecione as ${isBet?'casas de apostas':'exchanges'} ativas na tabela deste mês:</div>
    ${isBet?`<div style="font-size:11px;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:5px"><i class="ti ti-shield-check" style="color:var(--green);font-size:12px"></i> Regulamentadas pelo SPA/MF Brasil 2024</div>`:''}
    <div style="display:grid;grid-template-columns:${isBet?'1fr 1fr':'1fr 1fr'};gap:8px;max-height:320px;overflow-y:auto;padding-right:4px">
      ${list.map(ex=>{
        const isCustom=customList.includes(ex);
        const safeId='col-'+ex.replace(/[^a-zA-Z0-9]/g,'_');
        return`<label class="toggle" style="padding:8px 10px;background:var(--card2);border-radius:6px;border:1px solid var(--border2);cursor:pointer">
          <input type="checkbox" id="${safeId}" ${active.includes(ex)?'checked':''}>
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
          <span style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ex}</span>
          <button onclick="event.preventDefault();event.stopPropagation();deleteHouseItem('${ex.replace(/'/g,"\\'")}','${bancaId}','${monthId}')" style="opacity:.35;color:var(--red);padding:2px 5px;border-radius:4px;font-size:12px;flex-shrink:0;transition:.15s" onmouseenter="this.style.opacity='1';this.style.background='rgba(255,69,96,.1)'" onmouseleave="this.style.opacity='.35';this.style.background='none'" title="Remover da lista"><i class="ti ti-trash"></i></button>
        </label>`;
      }).join('')}
    </div>
    <div class="form-group" style="margin-top:16px"><label class="form-label">Adicionar ${lbl} personalizada</label>
      <div style="display:flex;gap:8px"><input id="m-custom-ex" class="form-control" placeholder="Nome da ${lbl}...">
      <button class="btn btn-secondary btn-sm" onclick="addCustomItem()"><i class="ti ti-plus"></i> Add</button></div>
    </div>`,
    onOk:()=>{
      m.activeExchanges=list.filter(ex=>document.getElementById('col-'+ex.replace(/[^a-zA-Z0-9]/g,'_'))?.checked);
      closeModal();renderPage();
    }
  });
}

function addCustomItem(){
  const val=document.getElementById('m-custom-ex').value.trim();
  if(!val)return;
  const ctx=window._manageColCtx;
  if(!ctx)return;
  if(ctx.isBet){
    if(BET_HOUSES.includes(val))return;
    BET_HOUSES.push(val);
    state.customBetHouses.push(val);
  }else{
    if(EXCHANGES.includes(val))return;
    EXCHANGES.push(val);
    state.customExchanges.push(val);
  }
  showManageColumns(ctx.bancaId,ctx.monthId);
}

function deleteHouseItem(name,bancaId,monthId){
  const banca=state.bancas.find(b=>b.id===bancaId);
  const isBet=banca?.type==='bet';
  if(isBet){
    const idx=BET_HOUSES.indexOf(name);
    if(idx>-1)BET_HOUSES.splice(idx,1);
    state.customBetHouses=state.customBetHouses.filter(e=>e!==name);
  }else{
    const idx=EXCHANGES.indexOf(name);
    if(idx>-1)EXCHANGES.splice(idx,1);
    state.customExchanges=state.customExchanges.filter(e=>e!==name);
  }
  Object.values(state.months).forEach(arr=>arr.forEach(m=>{
    m.activeExchanges=(m.activeExchanges||[]).filter(e=>e!==name);
  }));
  showManageColumns(bancaId,monthId);
}

function showAddEmprestimoModal(){
  showModal({
    title:'Novo devedor',
    large:true,
    body:`
    <div class="form-group"><label class="form-label">Nome</label><input id="m-nome" class="form-control"></div>
    <div class="form-group"><label class="form-label">Descrição</label><input id="m-desc" class="form-control"></div>

      <div class="form-group"><label class="form-label">Juros %/mês</label><input id="m-jur" class="form-control" type="number" step="0.1" value="5" oninput="genParcelasInputs()"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Número de parcelas</label>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">

        </div>
        <input id="m-nparc" class="form-control" type="number" value="6" min="1" max="60" placeholder="Outro..." oninput="genParcelasInputs();highlightNparcChip(this.value)" style="width:120px">

    <div id="parcelas-preview"></div>`,

function genParcelasInputs(){
  const nparc=parseInt(document.getElementById('m-nparc')?.value)||0;
  const cap=parseFloat(document.getElementById('m-cap')?.value)||0;
  const jur=parseFloat(document.getElementById('m-jur')?.value)||0;
  const venc=document.getElementById('m-venc')?.value||'';
  const container=document.getElementById('parcelas-preview');
  if(!container||!nparc)return;
  const defaultVal=cap&&nparc?parseFloat(((cap+cap*jur/100*nparc)/nparc).toFixed(2)):0;
  container.innerHTML=`
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:10px;margin-top:4px">Valor por parcela (R$)</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:200px;overflow-y:auto;padding-right:4px">
      ${Array.from({length:nparc},(_,i)=>`
        <div class="form-group" style="margin-bottom:8px">
          <label style="font-size:10px;color:var(--text2);display:block;margin-bottom:4px">${getParcelaMes(i,venc)}</label>
          <input id="parc-val-${i}" class="form-control" type="number" step="0.01" value="${defaultVal}" style="padding:6px 8px" oninput="updateParcelasPreview()">
        </div>`).join('')}
    </div>
    <div id="parcelas-summary" style="margin-top:10px;padding:10px 12px;background:var(--card2);border-radius:6px;font-size:12px;color:var(--text2);border:1px solid var(--border2)"></div>`;
  updateParcelasPreview();
}

function updateParcelasPreview(){
  const nparc=parseInt(document.getElementById('m-nparc')?.value)||0;
  const cap=parseFloat(document.getElementById('m-cap')?.value)||0;
  let total=0;
  for(let i=0;i<nparc;i++){
    total+=parseFloat(document.getElementById(`parc-val-${i}`)?.value)||0;
  }
  const el=document.getElementById('parcelas-summary');
  if(!el)return;
  const juros=total-cap;
  el.innerHTML=`Capital: <b class="font-mono">${fmtBRL(cap)}</b> · Total receber: <b class="font-mono">${fmtBRL(total)}</b> · ${juros>=0?`Juros: <b style="color:var(--green)">${fmtBRL(juros)}</b>`:`<span style="color:var(--red)">Abaixo do capital: ${fmtBRL(-juros)}</span>`}`;
}

function setNparc(n){
  const inp=document.getElementById('m-nparc');
  if(!inp)return;
  inp.value=n;
  genParcelasInputs();
  highlightNparcChip(n);
}
function highlightNparcChip(val){
  [1,2,3,4,5,6,8,10,12,18,24].forEach(n=>{
    const el=document.getElementById(`nparc-chip-${n}`);
    if(!el)return;
    const active=parseInt(val)===n;
    el.style.background=active?'var(--orange)':'var(--card2)';
    el.style.color=active?'#000':'var(--text2)';
    el.style.borderColor=active?'var(--orange)':'var(--border2)';
  });
}

function getParcelaMes(offset,baseDate){
  const d=baseDate?new Date(baseDate+'T12:00:00'):new Date();
  if(!baseDate)d.setMonth(d.getMonth()+1);
  d.setMonth(d.getMonth()+offset);
  return (d.getMonth()+1).toString().padStart(2,'0')+'/'+d.getFullYear().toString().substr(2);
}

function editEmprestimo(id){
  const e=state.emprestimos.find(e=>e.id===id);
  if(!e)return;

  const nAtual=e.parcelas?.length||6;
  const chips=[1,2,3,4,5,6,8,10,12,18,24];
  showModal({

    large:true,

    <div class="form-row">
      <div class="form-group"><label class="form-label">Capital (R$)</label><input id="m-cap" class="form-control" type="number" step="0.01" value="${e.capital}" oninput="genEditParcelasInputs()"></div>
      <div class="form-group"><label class="form-label">Juros %/mês</label><input id="m-jur" class="form-control" type="number" step="0.1" value="${e.jurosPct}" oninput="genEditParcelasInputs()"></div>
    </div>
    <div class="form-group"><label class="form-label">Vencimento (1ª parcela)</label><input id="m-venc" class="form-control" type="date" value="${e.vencimento||''}" onchange="genEditParcelasInputs()"></div>
    <div class="form-group"><label class="form-label">Número de parcelas</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
        ${chips.map(n=>`<button type="button" onclick="setEditNparc(${n})" id="edit-nparc-chip-${n}" style="padding:5px 12px;border-radius:20px;border:1px solid ${n===nAtual?'var(--orange)':'var(--border2)'};background:${n===nAtual?'var(--orange)':'var(--card2)'};color:${n===nAtual?'#000':'var(--text2)'};font-size:12px;font-weight:600;cursor:pointer;transition:var(--t)">${n}x</button>`).join('')}
      </div>
      <input id="m-nparc" class="form-control" type="number" value="${nAtual}" min="1" max="60" placeholder="Outro..." oninput="genEditParcelasInputs();highlightEditNparcChip(this.value)" style="width:120px">
    </div>
    <div id="edit-parcelas-preview"></div>`,
    onOk:()=>{
      const emp=state.emprestimos.find(e=>e.id===window._editEmpId);
      if(!emp)return;
      emp.nome=document.getElementById('m-nome').value;
      emp.descricao=document.getElementById('m-desc').value;
      emp.capital=parseFloat(document.getElementById('m-cap').value)||0;
      emp.jurosPct=parseFloat(document.getElementById('m-jur').value)||0;
      emp.vencimento=document.getElementById('m-venc').value;
      const nparc=parseInt(document.getElementById('m-nparc').value)||emp.parcelas?.length||6;
      emp.parcelas=Array.from({length:nparc},(_,i)=>{
        const v=parseFloat(document.getElementById(`ep-val-${i}`)?.value)||0;
        const existing=emp.parcelas?.[i];
        return{id:i+1,mes:getParcelaMes(i),pago:existing?.pago||false,valor:v};
      });
      const total=emp.parcelas.reduce((s,p)=>s+(p.valor||0),0);
      emp.parcelaMensal=emp.parcelas.length?parseFloat((total/emp.parcelas.length).toFixed(2)):0;
      closeModal();renderPage();
    }
  });
  setTimeout(()=>genEditParcelasInputs(),60);
